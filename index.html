<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Krakeeb</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">
<style>
:root{
  --bg:#f6f5f2; --panel:#ffffff; --panel2:#faf9f7; --ink:#1d1c1a; --muted:#6f6b65; --faint:#a19c94;
  --line:#e7e4de; --line2:#d9d5ce; --accent:#c96442; --accent-soft:#f6e6de;
  --live:#2f9e62; --live-soft:#e1f3e8; --busy:#d48a1c; --busy-soft:#fbefd9;
  --hot:#d1543f; --hot-soft:#fbe4df; --cold:#9b968e; --blue:#3a6fd1; --blue-soft:#e3ebfa;
  --violet:#7a55c7; --violet-soft:#ece5f8;
  --shadow:0 1px 2px rgba(30,25,20,.05),0 4px 14px rgba(30,25,20,.04);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#191816; --panel:#22211e; --panel2:#1d1c1a; --ink:#ece9e3; --muted:#a39e95; --faint:#6f6a62;
    --line:#2f2d29; --line2:#3a3833; --accent:#e08360; --accent-soft:#3a2820;
    --live:#4cc283; --live-soft:#1d3327; --busy:#e9a540; --busy-soft:#3a2e18;
    --hot:#ec7561; --hot-soft:#3c2320; --cold:#6f6a62; --blue:#7ba2ef; --blue-soft:#1f2a3f;
    --violet:#a98ce6; --violet-soft:#2b2440;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto;background:var(--panel2)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);display:grid;place-items:center;font-size:17px}
.brand .ar{font-weight:500;color:var(--muted);margin-inline-start:6px}
.demo{background:var(--busy-soft);color:var(--busy);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:14px}
.brand h1{font-size:15px;margin:0;font-weight:600}
.brand small{display:block;color:var(--muted);font-size:12px}
.side-h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);padding:14px 8px 6px;font-weight:600}
.proj{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 8px;color:var(--ink)}
.proj:hover{background:var(--line)}
.proj.on{background:var(--accent-soft);color:var(--accent)}
.proj .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj .ct{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.proj .d{width:7px;height:7px;border-radius:50%;flex:none}
main{padding:22px 28px 60px;min-width:0}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);font:inherit;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select{font:inherit;border:1px solid var(--line2);background:var(--panel);color:var(--ink);border-radius:10px;padding:7px 10px}
.stats{display:flex;gap:10px;margin:4px 0 20px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:120px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.sync{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 var(--live);animation:pl 2s infinite}
.pulse.err{background:var(--hot);animation:none}
@keyframes pl{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--live) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.group{margin-bottom:26px}
.group-h{display:flex;align-items:baseline;gap:10px;margin:0 0 10px}
.group-h h2{font-size:14px;margin:0;font-weight:600}
.group-h code{font:12px var(--mono);color:var(--muted)}
.tree{display:flex;flex-direction:column;gap:8px}
.kids{margin-left:22px;padding-left:16px;border-left:2px solid var(--line2);display:flex;flex-direction:column;gap:8px;margin-top:8px;position:relative}
.node{position:relative}
.kids>.node::before{content:"";position:absolute;left:-16px;top:24px;width:14px;border-top:2px solid var(--line2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);transition:border-color .15s}
.card:hover{border-color:var(--line2)}
.card.open{border-color:var(--accent)}
.card.obsolete{opacity:.55}
.card.obsolete:hover{opacity:.85}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 14px;cursor:pointer}
.heat{width:10px;height:10px;border-radius:50%;margin-top:5px}
.h-busy{background:var(--busy);box-shadow:0 0 0 3px var(--busy-soft);animation:pl 1.6s infinite}
.h-live{background:var(--live);box-shadow:0 0 0 3px var(--live-soft)}
.h-day{background:var(--hot)} .h-week{background:var(--busy)} .h-old{background:var(--cold);opacity:.6}
.title{font-weight:600;display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}
.title .t{overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sub{color:var(--muted);font-size:13px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.sub em{font-style:normal;color:var(--faint)}
.badge{font-size:11px;font-weight:500;padding:2px 7px;border-radius:999px;background:var(--line);color:var(--muted);white-space:nowrap}
.b-live{background:var(--live-soft);color:var(--live)} .b-busy{background:var(--busy-soft);color:var(--busy)}
.b-branch{background:var(--violet-soft);color:var(--violet)} .b-cont{background:var(--blue-soft);color:var(--blue)}
.b-hot{background:var(--hot-soft);color:var(--hot)} .b-obs{background:var(--line);color:var(--faint);text-decoration:line-through}
.meta{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
.meta .when{font-size:13px;color:var(--ink);font-weight:500}
.detail{border-top:1px solid var(--line);padding:14px 16px 16px;display:grid;gap:16px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 18px}
.kv div{min-width:0}
.kv label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:600}
.kv span{font-size:13px;word-break:break-word}
.mono{font-family:var(--mono);font-size:12px}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:6px 11px;font-size:13px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.07);color:#fff}
.btn.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.resume{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:8px 8px 8px 14px}
.resume code{flex:1;min-width:0;font:12.5px var(--mono);overflow-x:auto;white-space:nowrap}
.resume .btn{flex:none}
.sep{width:1px;height:20px;background:var(--line2);margin:0 4px}
.sec h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
.quote{border-left:3px solid var(--violet);background:var(--violet-soft);padding:8px 12px;border-radius:0 8px 8px 0;font-size:13px;white-space:pre-wrap;word-break:break-word;max-height:140px;overflow:auto}
.timeline{display:flex;flex-direction:column;gap:2px;max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.tl{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px}
.tl:last-child{border-bottom:0}
.tl time{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.tl p{margin:0;white-space:pre-wrap;word-break:break-word;max-height:4.4em;overflow:hidden;cursor:pointer}
.tl p.full{max-height:none}
ul.plain{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px}
textarea{width:100%;min-height:54px;resize:vertical;border:1px solid var(--line2);border-radius:8px;background:var(--panel2);color:var(--ink);font:inherit;padding:8px 10px;outline:none}
textarea:focus{border-color:var(--accent)}
.note{font-size:12px;color:var(--accent);margin-top:4px}
.empty{padding:60px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.legend{display:flex;flex-direction:column;gap:6px;padding:4px 8px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
@media (max-width:820px){
  .app{grid-template-columns:1fr} aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  main{padding:16px} .row{grid-template-columns:auto 1fr} .meta{grid-column:2;text-align:left}
  .kids{margin-left:6px;padding-left:10px} .tl{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="logo">📦</div><div><h1>Krakeeb<span class="ar" lang="ar">كراكيب</span></h1><small>Your Claude Code sessions, sorted</small></div></div>
    <div class="side-h">Projects</div>
    <div id="projects"></div>
    <div class="side-h">Activity</div>
    <div class="legend">
      <span><i style="background:var(--busy)"></i>Running now</span>
      <span><i style="background:var(--live)"></i>Open process, idle</span>
      <span><i style="background:var(--hot)"></i>Active in last 24h</span>
      <span><i style="background:var(--busy);opacity:.7"></i>Active this week</span>
      <span><i style="background:var(--cold)"></i>Older</span>
    </div>
  </aside>
  <main>
    <div class="top">
      <label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" placeholder="Search titles, prompts, ids, paths…" autocomplete="off"></label>
      <div class="chips" id="filters"></div>
      <select id="sort"><option value="last">Last active</option><option value="first">Started</option><option value="size">Size</option><option value="prompts">Prompts</option></select>
      <div class="sync"><span class="pulse" id="pulse"></span><span id="synced">loading…</span></div>
    </div>
    <div class="demo" id="demo" hidden>Demo mode: these sessions are made up.</div>
    <div class="stats" id="stats"></div>
    <div id="list"></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS={get(k,d){try{const v=localStorage.getItem("csb."+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem("csb."+k,JSON.stringify(v))}catch{}}};
let DATA=null, lastOk=0, details={}, open=new Set(LS.get("open",[]));
let state={q:"",filter:LS.get("filter","all"),project:LS.get("project",null),sort:LS.get("sort","last")};
const FILTERS=[["all","All"],["live","Live"],["hot","★ Hot"],["active","Active · 7d"],["nobs","Hide obsolete"],["obs","Obsolete"]];

function rel(ms){if(!ms)return"—";const s=(Date.now()-ms)/1000;
  if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+"m ago";if(s<86400)return Math.floor(s/3600)+"h ago";
  if(s<86400*30)return Math.floor(s/86400)+"d ago";return new Date(ms).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}
function abs(ms){return ms?new Date(ms).toLocaleString(undefined,{weekday:"short",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}):"—"}
function size(b){return b>1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB"}
function tilde(p){return p&&DATA?p.replace(DATA.home,"~"):p}
function heat(s){if(s.live)return s.live.status==="busy"?"busy":"live";const a=Date.now()-s.last_ts;return a<864e5?"day":a<6048e5?"week":"old"}
function clean(t){return String(t||"").replace(/<\/?pasted_content[^>]*>/g,"").replace(/\s+/g," ").trim()}
function title(s){
  const autoName=s.live&&s.live.name&&!/^[\w.-]+-[a-z0-9]{1,3}$/i.test(s.live.name)?s.live.name:null;
  return s.custom_title||s.ai_title||autoName||s.agent_name||clean(s.first_prompt).slice(0,90)||"(untitled) "+s.id.slice(0,8)}
function projKey(s){return s.project_dir}
function projLabel(dir){const ss=DATA.sessions.filter(s=>s.project_dir===dir&&s.cwd).sort((a,b)=>b.last_ts-a.last_ts);
  const exact=ss.find(s=>s.cwd.replace(/[^A-Za-z0-9]/g,"-")===dir);
  return exact?tilde(exact.cwd):ss.length?tilde(ss[0].cwd):dir.replace(/^-/,"/").replace(/-/g,"/")}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),1600)}

async function load(){
  try{const r=await fetch("/api/sessions",{cache:"no-store"});DATA=await r.json();lastOk=Date.now();$("#pulse").classList.remove("err");
    const a=document.activeElement; if(a&&a.tagName==="TEXTAREA")return; render()}
  catch(e){$("#pulse").classList.add("err");$("#synced").textContent="server unreachable"}
}
setInterval(load,8000);
setInterval(()=>{if(lastOk)$("#synced").textContent="synced "+rel(lastOk).replace("just now","just now")},1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});

function matches(s){
  const m=s.mark||{};
  if(state.project&&s.project_dir!==state.project)return false;
  const f=state.filter;
  if(f==="live"&&!s.live)return false;
  if(f==="hot"&&m.status!=="hot")return false;
  if(f==="active"&&Date.now()-s.last_ts>6048e5)return false;
  if(f==="nobs"&&m.status==="obsolete")return false;
  if(f==="obs"&&m.status!=="obsolete")return false;
  if(state.q){const q=state.q.toLowerCase();
    const hay=[s.id,title(s),s.custom_title,s.ai_title,s.agent_name,s.first_prompt,s.latest_prompt,s.cwd,s.git_branch,m.note,s.live&&s.live.name,s.branched_after].join(" ").toLowerCase();
    if(!hay.includes(q))return false}
  return true
}
function sortKey(s){return state.sort==="first"?s.first_ts:state.sort==="size"?s.size:state.sort==="prompts"?s.prompt_count:s.last_ts}

function render(){
  if(!DATA)return;
  $("#demo").hidden=!DATA.demo;
  const all=DATA.sessions, by=Object.fromEntries(all.map(s=>[s.id,s]));
  const kids={}; all.forEach(s=>{if(s.parent&&by[s.parent])(kids[s.parent]=kids[s.parent]||[]).push(s)});
  // a node is shown if it or any descendant matches; ancestors kept for context
  const vis={};
  const visit=s=>{let v=matches(s);(kids[s.id]||[]).forEach(k=>{if(visit(k))v=true});vis[s.id]=v;return v};
  const roots=all.filter(s=>!s.parent||!by[s.parent]);roots.forEach(visit);
  const agg={};const aggF=s=>{let v=sortKey(s);(kids[s.id]||[]).forEach(k=>{v=Math.max(v,aggF(k))});return agg[s.id]=v};roots.forEach(aggF);
  const desc=(a,b)=>agg[b.id]-agg[a.id];

  // sidebar
  const projs={};all.forEach(s=>{const p=projs[s.project_dir]=projs[s.project_dir]||{n:0,last:0,live:0};p.n++;p.last=Math.max(p.last,s.last_ts);if(s.live)p.live++});
  const pl=Object.entries(projs).sort((a,b)=>b[1].last-a[1].last);
  $("#projects").innerHTML=`<button class="proj ${!state.project?"on":""}" data-proj=""><span class="d" style="background:var(--accent)"></span><span class="nm">All projects</span><span class="ct">${all.length}</span></button>`+
    pl.map(([d,p])=>{const lbl=projLabel(d);return`<button class="proj ${state.project===d?"on":""}" data-proj="${esc(d)}" title="${esc(lbl)} · last active ${esc(rel(p.last))}">
      <span class="d" style="background:${p.live?"var(--live)":Date.now()-p.last<864e5?"var(--hot)":"var(--cold)"}"></span>
      <span class="nm">${esc(lbl.split("/").pop()||lbl)}</span><span class="ct">${p.n}</span></button>`}).join("");

  $("#filters").innerHTML=FILTERS.map(([k,l])=>`<button class="chip ${state.filter===k?"on":""}" data-filter="${k}">${l}</button>`).join("");
  $("#sort").value=state.sort;

  const shown=all.filter(s=>state.project?s.project_dir===state.project:true);
  const liveN=shown.filter(s=>s.live).length, busyN=shown.filter(s=>s.live&&s.live.status==="busy").length;
  const day=shown.filter(s=>Date.now()-s.last_ts<864e5).length, br=shown.filter(s=>s.relation==="branch").length;
  const hot=shown.filter(s=>(s.mark||{}).status==="hot").length;
  $("#stats").innerHTML=[[shown.length,"sessions"],[br,"branches"],[liveN+(busyN?` <small style="font-size:12px;color:var(--busy)">· ${busyN} running</small>`:""),"open processes"],[day,"active in 24h"],[hot,"marked hot"]]
    .map(([v,l])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");

  const groups={};roots.filter(r=>vis[r.id]).forEach(r=>(groups[r.project_dir]=groups[r.project_dir]||[]).push(r));
  const gl=Object.entries(groups).sort((a,b)=>Math.max(...b[1].map(r=>agg[r.id]))-Math.max(...a[1].map(r=>agg[r.id])));
  const node=s=>{const ks=(kids[s.id]||[]).filter(k=>vis[k.id]).sort(desc);
    return`<div class="node">${card(s,by,kids)}${ks.length?`<div class="kids">${ks.map(node).join("")}</div>`:""}</div>`};
  $("#list").innerHTML=gl.length?gl.map(([d,rs])=>`<section class="group"><div class="group-h"><h2>${esc(projLabel(d).split("/").pop())}</h2><code>${esc(projLabel(d))}</code></div>
     <div class="tree">${rs.sort(desc).map(node).join("")}</div></section>`).join("")
    :`<div class="empty">No sessions match.</div>`;
}

function card(s,by,kids){
  const m=s.mark||{}, h=heat(s), isOpen=open.has(s.id), st=m.status;
  const b=[];
  if(s.live)b.push(`<span class="badge ${s.live.status==="busy"?"b-busy":"b-live"}">${s.live.status==="busy"?"● running":"● open"}${s.live.kind==="bg"?" · bg":""}</span>`);
  if(s.relation==="branch")b.push(`<span class="badge b-branch" title="forked from ${esc(s.parent)}">⑂ branch</span>`);
  if(s.relation==="continued")b.push(`<span class="badge b-cont" title="continued from ${esc(s.parent)}">↪ continued</span>`);
  if(st==="hot")b.push(`<span class="badge b-hot">★ hot</span>`);
  if(st==="obsolete")b.push(`<span class="badge b-obs">obsolete</span>`);
  if(s.remote)b.push(`<span class="badge">remote control</span>`);
  (s.entrypoints||[]).filter(e=>e!=="cli").forEach(e=>b.push(`<span class="badge">${esc(e.replace("claude-",""))}</span>`));
  const nk=(kids[s.id]||[]).length; if(nk)b.push(`<span class="badge">${nk} ${nk>1?"children":"child"}</span>`);
  const started=clean(s.first_prompt), lastp=clean(s.latest_prompt);
  const sub=started?`<em>${s.relation==="branch"?"Branch started:":"Started:"}</em> ${esc(started.slice(0,260))}`
    :lastp?`<em>Last prompt:</em> ${esc(lastp.slice(0,260))}`:"";
  return`<div class="card ${isOpen?"open":""} ${st==="obsolete"?"obsolete":""}" data-id="${s.id}">
   <div class="row" data-toggle="${s.id}">
     <span class="heat h-${h}" title="${{busy:"Running now",live:"Process open",day:"Active in last 24h",week:"Active this week",old:"Older"}[h]}"></span>
     <div style="min-width:0"><div class="title"><span class="t">${esc(title(s))}</span>${b.join("")}</div>
       ${sub?`<div class="sub">${sub}</div>`:""}
       ${m.note?`<div class="note">✎ ${esc(m.note)}</div>`:""}</div>
     <div class="meta"><div class="when" title="${esc(abs(s.last_ts))}">${rel(s.last_ts)}</div>
       <div>${s.prompt_count} prompt${s.prompt_count==1?"":"s"} · ${size(s.size)}</div></div>
   </div>
   ${isOpen?detail(s,by):""}
  </div>`
}

function detail(s,by){
  const m=s.mark||{}, d=details[s.id];
  const par=s.parent&&by[s.parent];
  const models=Object.keys(s.models||{}).map(x=>x.replace(/^claude-/,"")).join(", ")||"—";
  const resume=`cd ${JSON.stringify(s.cwd||"")} && claude --resume ${s.id}`;
  const kv=[["Session id",`<span class="mono">${esc(s.id)}</span>`],["Last active",esc(abs(s.last_ts))],["Started",esc(abs(s.first_ts))],
    ["Directory",`<span class="mono">${esc(tilde(s.cwd))}</span>`],["Git branch",esc(s.git_branch||"—")],["Models",esc(models)],
    ["Messages",`${s.own_msgs} own${s.inherited_msgs?` + ${s.inherited_msgs} inherited`:""}`],
    ["Prompts",`${s.prompt_count}${s.inherited_prompts?` (+${s.inherited_prompts} from parent)`:""}`],
    s.cost!=null?["Cost (last process)","$"+Number(s.cost).toFixed(2)]:null,
    s.lines_added!=null?["Lines","+"+s.lines_added+" / −"+s.lines_removed]:null,
    s.compactions?["Compactions",s.compactions]:null,
    s.live?["Process",`pid ${s.live.pid} · ${esc(s.live.status)} · ${esc(s.live.kind||"")}${s.live.name?` · “${esc(s.live.name)}”`:""}`]:null,
    ["Version",esc(s.version||"—")],["File",`<span class="mono">${size(s.size)}</span>`],
    s.ai_title&&s.custom_title&&s.ai_title!==s.custom_title?["Auto title",esc(s.ai_title)]:null,
  ].filter(Boolean);
  const pr=d?d.prompts:null;
  return`<div class="detail">
   <div class="actions">
     ${DATA.platform==="darwin"&&!DATA.demo?`<button class="btn" data-act="term" data-id="${s.id}">Resume in Terminal</button>`:""}
     <button class="btn" data-copy="${s.id}">Copy id</button>
     <span class="sep"></span>
     <button class="btn ${m.status==="hot"?"sel":""}" data-mark="hot" data-id="${s.id}">★ Hot</button>
     <button class="btn ${m.status==="obsolete"?"sel":""}" data-mark="obsolete" data-id="${s.id}">Obsolete</button>
     ${m.status?`<button class="btn" data-mark="" data-id="${s.id}">Clear mark</button>`:""}
   </div>
   <div class="sec"><h4>Get back to this chat</h4>
     <div class="resume"><code>${esc(resume)}</code><button class="btn pri" data-copy="${esc(resume)}">Copy resume command</button></div></div>
   ${par?`<div class="sec"><h4>${s.relation==="branch"?"Branched from":"Continued from"}</h4>
      <a href="#" data-jump="${par.id}">${esc(title(par))}</a> <span class="mono" style="color:var(--faint)">${par.id.slice(0,8)}</span>
      ${s.branched_after?`<div class="quote" style="margin-top:8px"><b style="font-size:11px;letter-spacing:.05em;text-transform:uppercase">Last shared prompt</b>\n${esc(clean(s.branched_after))}</div>`:""}</div>`:""}
   <div class="kv">${kv.map(([k,v])=>`<div><label>${k}</label><span>${v}</span></div>`).join("")}</div>
   <div class="sec"><h4>Note</h4><textarea data-note="${s.id}" placeholder="Your own note about this chat (saved when you click away)…">${esc(m.note||"")}</textarea></div>
   ${(s.artifacts||[]).filter(a=>a.url).length?`<div class="sec"><h4>Artifacts</h4><ul class="plain">${s.artifacts.filter(a=>a.url).map(a=>`<li><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title||a.url)}</a></li>`).join("")}</ul></div>`:""}
   ${(s.subagents||[]).length?`<div class="sec"><h4>Subagents (${s.subagents.length})</h4><ul class="plain">${s.subagents.map(a=>`<li>${a.finished?"✓":"…"} ${esc(a.description||a.type)} <span style="color:var(--faint)">· ${esc(a.type||"")} · ${rel(a.mtime)}</span></li>`).join("")}</ul></div>`:""}
   <div class="sec"><h4>Your prompts in this ${s.relation==="branch"?"branch":"session"}${pr?` (${pr.length})`:""}</h4>
     ${pr?(pr.length?`<div class="timeline">${pr.map(p=>`<div class="tl"><time title="${esc(abs(p.ts))}">${esc(abs(p.ts))}</time><p>${esc(p.text.replace(/<\/?pasted_content[^>]*>/g,""))}</p></div>`).join("")}</div>`:`<div style="color:var(--muted);font-size:13px">No typed prompts recorded.</div>`)
       :`<div style="color:var(--muted);font-size:13px">Loading…</div>`}
   </div>
  </div>`
}

async function loadDetail(id){
  try{const r=await fetch("/api/session?id="+encodeURIComponent(id));if(r.ok){details[id]=await r.json();render()}}catch{}
}
async function post(path,body){const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});return r.ok}

document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-toggle],[data-filter],[data-proj],[data-copy],[data-mark],[data-act],[data-jump],.tl p");
  if(!t)return;
  if(t.matches(".tl p")){t.classList.toggle("full");return}
  if(t.dataset.toggle){const id=t.dataset.toggle;if(open.has(id))open.delete(id);else{open.add(id);loadDetail(id)}LS.set("open",[...open]);render();return}
  if(t.dataset.filter){state.filter=t.dataset.filter;LS.set("filter",state.filter);render();return}
  if(t.dataset.proj!==undefined){state.project=t.dataset.proj||null;LS.set("project",state.project);render();window.scrollTo(0,0);return}
  if(t.dataset.copy!==undefined){try{await navigator.clipboard.writeText(t.dataset.copy);toast("Copied")}catch{toast("Copy failed")}return}
  if(t.dataset.mark!==undefined){const id=t.dataset.id,s=DATA.sessions.find(x=>x.id===id);
    const v=t.dataset.mark; if(await post("/api/mark",{id,status:v||null})){s.mark=Object.assign({},s.mark,{status:v||undefined});if(!v)delete s.mark.status;render()}return}
  if(t.dataset.act==="term"){toast(await post("/api/resume",{id:t.dataset.id})?"Opening Terminal…":"Could not open Terminal");return}
  if(t.dataset.jump){e.preventDefault();const id=t.dataset.jump;open.add(id);loadDetail(id);render();
    const el=document.querySelector(`.card[data-id="${id}"]`);if(el){el.scrollIntoView({behavior:"smooth",block:"center"})}}
});
document.addEventListener("focusout",async e=>{
  const t=e.target; if(!t.dataset||!t.dataset.note)return;
  const id=t.dataset.note,s=DATA.sessions.find(x=>x.id===id); const v=t.value.trim();
  if((s.mark||{}).note===v||(!v&&!(s.mark||{}).note))return;
  if(await post("/api/mark",{id,note:v||null})){s.mark=Object.assign({},s.mark);if(v)s.mark.note=v;else delete s.mark.note;toast("Note saved");setTimeout(render,0)}
});
$("#q").addEventListener("input",e=>{state.q=e.target.value.trim();render()});
$("#sort").addEventListener("change",e=>{state.sort=e.target.value;LS.set("sort",state.sort);render()});
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement.tagName!=="INPUT"&&document.activeElement.tagName!=="TEXTAREA"){e.preventDefault();$("#q").focus()}});
const deep=new URLSearchParams(location.search).get("open");
if(deep){open.add(deep);setTimeout(()=>{const el=document.querySelector(`.card[data-id="${CSS.escape(deep)}"]`);if(el&&el.getBoundingClientRect().bottom>innerHeight)el.scrollIntoView({block:"start"})},600)}
open.forEach(loadDetail);
load();
</script>
</body>
</html>
